# Deploy as a separate Railway service (root directory: infra/icecast).
# Service slug should be `icecast` so bots reach icecast.railway.internal.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/status-json.xsl"
healthcheckTimeout = 30
