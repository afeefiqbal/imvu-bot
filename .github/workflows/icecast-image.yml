name: Publish Icecast image

on:
  push:
    branches: [main]
    paths:
      - "infra/icecast/**"
      - ".github/workflows/icecast-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: infra/icecast
          push: true
          tags: |
            ghcr.io/afeefiqbal/imvu-icecast:latest
            ghcr.io/afeefiqbal/imvu-icecast:${{ github.sha }}
