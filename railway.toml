# IMVU Chrome profiles: attach a Railway Volume to this service with mount path:
#   /app/lurkbot-bot/profiles
# (Dashboard: service → Settings → Volumes → Add Volume, or ⌘K → “Volume”.)
# Volumes are not defined in this file — Railway config-as-code does not support volume mounts yet.
# After the volume exists, seed login once per BOT_NAME (e.g. room-joiner) so cookies survive redeploys.

[build]
buildCommand = "composer install --no-dev --optimize-autoloader && npm install && npm run build"

[deploy]
startCommand = "bash scripts/railway-web-and-bot.sh"
preDeploy = "php artisan migrate --force"
